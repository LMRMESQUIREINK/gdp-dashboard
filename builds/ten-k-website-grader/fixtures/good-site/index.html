<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember &amp; Oak Steakhouse</title>
  <style>
    body { font-family: 'Geist', sans-serif; font-size: 16px; color: #16120f; background: #f3ead9; }
    h1 { font-family: 'Fraunces', serif; font-size: 64px; color: #5c1a1a; }
    h2 { font-family: 'Fraunces', serif; font-size: 40px; }
    .eyebrow { font-size: 18px; color: #a9843c; }
    .card { transition: transform 200ms ease; }
    .card:hover { transform: translateY(-4px); }
    @keyframes emberGlow { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    .ember { animation: emberGlow 3s ease-in-out infinite; color: #5b6670; }
    @media (prefers-reduced-motion: reduce) {
      .card, .ember { animation: none; transition: none; }
    }
    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      nav { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Seattle, WA</p>
    <h1>Ember &amp; Oak</h1>
  </header>
  <main>
    <section id="menu">
      <h2>Dry-Aged Ribeye</h2>
      <img src="hero.jpg" alt="Dry-aged ribeye on a hearth-fired cast iron plate" loading="lazy">
    </section>
    <section id="reserve">
      <h2>Reserve a Table</h2>
      <div class="card ember">Six dishes, one fire.</div>
    </section>
  </main>
</body>
</html>
